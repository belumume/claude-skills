name: No Claude IDs
# Runs on pull requests and on pushes to the default branch. Skipped here,
# because skipped jobs use no Actions minutes and GitHub bills every job that
# runs as at least one whole minute: a push to any other branch (its pull
# request checks it), and the push of a pull request's merge commit (the
# pull request run already checked the commits it brings in; the merge
# commit's own message is GitHub's "Merge pull request #N from ..." line plus
# the PR title, unless someone types a custom message when merging, which
# this skip trusts). Direct pushes and rebase merges to the default branch
# still run.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    if: >-
      github.event_name == 'pull_request' ||
      (github.ref_name == github.event.repository.default_branch &&
       !startsWith(github.event.head_commit.message, 'Merge pull request #'))
    # One-CPU runner: a third of the price of ubuntu-latest, plenty for this job.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Only commit messages are read, so fetch commits without any files
      # (a few hundred KB instead of the whole repository).
      - name: Fetch commit history only
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init -q .
          git remote add origin "https://github.com/$REPO"
          git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git fetch -q --filter=tree:0 origin "$TIP"
      - name: Reject Claude trailers and claude.ai links in new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # Only commits that are new to the default branch are checked.
          # Commits already on it were checked when they landed there, so a
          # branch that is rebased onto, reset to or merged with the default
          # branch must not be failed again for them (that re-sent the same
          # failure email on every push).
          if [ "$EVENT" = "pull_request" ]; then
            # The base branch's CURRENT tip, not the sha the PR pinned at open.
            git fetch -q origin "$BASE_REF"
            set -- "$HEAD" --not FETCH_HEAD
          else
            # A push to the default branch (the job skips other branches).
            if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              set -- "$BEFORE..$SHA"
            elif git rev-parse -q --verify "$SHA~1^{commit}" >/dev/null; then
              set -- "$SHA~1..$SHA"
            else
              set -- "$SHA"  # the repository's first commit
            fi
          fi
          # Trailers are matched only at the start of a line, so a commit
          # message that merely mentions one in prose is not failed.
          # A failing git log stops the job here instead of passing as clean.
          log=$(git log --format='%h%n%B' "$@")
          bad=$(printf '%s\n' "$log" | grep -i -E '^[[:space:]]*(Claude[-]Session:|Co-Authored-By:.*(claude|anthropic))|https?://(www\.)?claude\.ai([^[:alnum:].-]|\.([^[:alnum:]]|$)|$)|(^|[^[:alnum:]./-])(www\.)?claude\.ai/' || true)
          if [ -n "$bad" ]; then
            echo "Commits carry Claude identifiers (project rule: none):"
            echo "$bad"
            exit 1
          fi
