name: Strip Claude IDs from PR text
# Commits are covered by no-claude-ids.yml. This covers what commits can't:
# PR descriptions, issues, comments and reviews, which agents post through the
# GitHub API with a claude.ai session link in the footer.
on:
  pull_request_target:
    types: [opened, edited, reopened]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  strip:
    # Runs only when the text this event posted could hold something to
    # strip, so the job is skipped (no Actions minutes) for ordinary comments
    # and edits, including this job's own edits once the text is clean. A
    # comment or review is judged by its own text, not the issue or PR it is
    # on, and never by the old text an "edited" event also carries.
    # contains() ignores case.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains((github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.pull_request.body, github.event.issue.body)), 'claude.ai') ||
      contains((github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.pull_request.body, github.event.issue.body)), format('{0}-projects-attribution', 'claude')) ||
      contains((github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.pull_request.body, github.event.issue.body)), 'Generated with') ||
      contains((github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.pull_request.body, github.event.issue.body)), 'Generated by') ||
      contains((github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.pull_request.body, github.event.issue.body)), 'Requested by')
    # One-CPU runner: a third of the price of ubuntu-latest, plenty for one
    # event. It stops jobs at 15 minutes, so a manual full sweep uses the
    # larger runner.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || 'ubuntu-slim' }}
    # A manual run sweeps everything ever posted, which takes longer.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 5 }}
    steps:
      # Runs the default branch's copy of the script, never a PR's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/scripts/strip-claude-ids.cjs');
            await run({ github, context, core });
